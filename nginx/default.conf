server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # NOTE: add_header in a location block replaces (not extends) these, so the
    # locations below repeat them.
    # Prototype with dummy data: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-cache" always;
    # Only this site may frame its pages (clickjacking protection)...
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 512;

    # ...except the planned-work widget, which is meant to be embedded by other sites.
    location = /embed.html {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
    }

    # Permanent short links for planned-work notices: /n/<slug> -> notice page.
    location ~ ^/n/[a-z0-9-]+/?$ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        try_files /notice.html =404;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
